resources:
  pipelines:
    taklaproducts_transformation_pipeline:
      name: taklaproducts-transformation-pipeline
      serverless: true
      allow_duplicate_names: true
      tags:
        environment: ${bundle.target}

      root_path: ${workspace.file_path}/pipelines/transformation_pipeline

      catalog: ${var.taklaproducts_catalog}
      schema: taklaproducts

      configuration:
        taklaproducts.catalog: ${var.taklaproducts_catalog}

      libraries:
        - glob:
            include: ../../pipelines/transformation_pipeline/transformations/**
